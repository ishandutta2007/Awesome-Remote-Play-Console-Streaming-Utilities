<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" style="background:#090d16; border-radius:16px; font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, Roboto, sans-serif;">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e1a"/>
      <stop offset="50%" stop-color="#101828"/>
      <stop offset="100%" stop-color="#070a12"/>
    </linearGradient>

    <!-- Vibrant Accents -->
    <linearGradient id="neonGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>

    <linearGradient id="accentCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#4facfe"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="rgba(255, 255, 255, 0.08)"/>
      <stop offset="100%" stop-color="rgba(255, 255, 255, 0.02)"/>
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <style>
    @keyframes pulseOrb {
      0%, 100% { transform: scale(1) translate(0, 0); opacity: 0.35; }
      50% { transform: scale(1.18) translate(-15px, 10px); opacity: 0.65; }
    }
    @keyframes floatParticle {
      0% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
      50% { transform: translateY(-25px) translateX(15px); opacity: 0.8; }
      100% { transform: translateY(0px) translateX(0px); opacity: 0.2; }
    }
    @keyframes streamData {
      0% { stroke-dashoffset: 400; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes pillHover {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-5px); }
    }

    .orb-glow { animation: pulseOrb 8s ease-in-out infinite alternate; transform-origin: center; }
    .floating-1 { animation: floatParticle 6s ease-in-out infinite; }
    .floating-2 { animation: floatParticle 8s ease-in-out infinite 1.5s; }
    .floating-3 { animation: floatParticle 7s ease-in-out infinite 3s; }
    .stream-line { stroke-dasharray: 20, 15; animation: streamData 12s linear infinite; }
    .stream-line-fast { stroke-dasharray: 10, 8; animation: streamData 6s linear infinite; }
    .badge-card { transition: all 0.3s ease; }
    .pill-1 { animation: pillHover 4s ease-in-out infinite; }
    .pill-2 { animation: pillHover 4.5s ease-in-out infinite 0.7s; }
    .pill-3 { animation: pillHover 5s ease-in-out infinite 1.4s; }
    .pill-4 { animation: pillHover 4.2s ease-in-out infinite 2.1s; }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bgGrad)"/>

  <!-- Decorative Background Grid Lines -->
  <g opacity="0.08" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="60" x2="1200" y2="60"/>
    <line x1="0" y1="120" x2="1200" y2="120"/>
    <line x1="0" y1="180" x2="1200" y2="180"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="300" x2="1200" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="360"/>
    <line x1="300" y1="0" x2="300" y2="360"/>
    <line x1="450" y1="0" x2="450" y2="360"/>
    <line x1="600" y1="0" x2="600" y2="360"/>
    <line x1="750" y1="0" x2="750" y2="360"/>
    <line x1="900" y1="0" x2="900" y2="360"/>
    <line x1="1050" y1="0" x2="1050" y2="360"/>
  </g>

  <!-- Animated Glowing Orbs (Safely placed in background) -->
  <g class="orb-glow">
    <circle cx="180" cy="80" r="140" fill="#38bdf8" filter="url(#softGlow)" opacity="0.15"/>
    <circle cx="1020" cy="260" r="160" fill="#a855f7" filter="url(#softGlow)" opacity="0.18"/>
    <circle cx="600" cy="320" r="110" fill="#3b82f6" filter="url(#softGlow)" opacity="0.12"/>
  </g>

  <!-- Dynamic Animated Streaming Waves / Data Streams -->
  <g opacity="0.4">
    <path class="stream-line" d="M -50 290 Q 250 200 550 280 T 1150 220 T 1300 270" fill="none" stroke="url(#accentCyan)" stroke-width="2.5"/>
    <path class="stream-line-fast" d="M -50 320 Q 350 230 750 320 T 1250 260" fill="none" stroke="url(#neonGlow)" stroke-width="2"/>
    <path class="stream-line" d="M 0 70 Q 300 130 650 60 T 1250 110" fill="none" stroke="#6366f1" stroke-width="1.8"/>
  </g>

  <!-- Floating Signal Particles -->
  <circle class="floating-1" cx="150" cy="220" r="4" fill="#38bdf8" filter="url(#glow)"/>
  <circle class="floating-2" cx="380" cy="90" r="3" fill="#818cf8"/>
  <circle class="floating-3" cx="820" cy="110" r="5" fill="#c084fc" filter="url(#glow)"/>
  <circle class="floating-1" cx="1080" cy="180" r="3.5" fill="#38bdf8"/>
  <circle class="floating-2" cx="950" cy="300" r="4.5" fill="#f43f5e" opacity="0.7"/>

  <!-- Foreground Main Title & Badges Header -->
  <g transform="translate(600, 75)" text-anchor="middle">
    <!-- Super Category Label -->
    <rect x="-140" y="-32" width="280" height="28" rx="14" fill="rgba(56, 189, 248, 0.12)" stroke="rgba(56, 189, 248, 0.35)" stroke-width="1"/>
    <text x="0" y="-14" fill="#38bdf8" font-size="12" font-weight="700" letter-spacing="2">🎮 ULTRA-LOW LATENCY STREAMING</text>

    <!-- Main Title -->
    <text x="0" y="42" fill="#ffffff" font-size="34" font-weight="800" letter-spacing="-0.5" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
      Remote Play &amp; Console Streaming
    </text>

    <!-- Gradient Subtitle / Tagline -->
    <text x="0" y="82" fill="url(#neonGlow)" font-size="18" font-weight="600" letter-spacing="0.5">
      The Curated Directory of Game Streaming Hosts, Clients &amp; Cloud Rigs
    </text>

    <!-- Description -->
    <text x="0" y="115" fill="#94a3b8" font-size="13.5" font-weight="400">
      Self-Hosted Moonlight/Sunshine Stacks • PlayStation &amp; Xbox Remote Play • Cloud Gaming SaaS • Low Latency &amp; VR
    </text>
  </g>

  <!-- Interactive Dynamic Feature Badges / Highlights (Anchored in bottom row) -->
  <g transform="translate(100, 245)">
    <!-- Pill 1: Sunshine & Moonlight -->
    <g class="pill-1" transform="translate(0, 0)">
      <rect width="225" height="58" rx="12" fill="url(#cardGrad)" stroke="rgba(56, 189, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="32" cy="29" r="14" fill="rgba(56, 189, 248, 0.15)"/>
      <text x="32" y="34" fill="#38bdf8" font-size="15" text-anchor="middle">⚡</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="700">Sunshine + Moonlight</text>
      <text x="56" y="44" fill="#94a3b8" font-size="11">Self-Hosted GameStream</text>
    </g>

    <!-- Pill 2: PlayStation Streaming -->
    <g class="pill-2" transform="translate(255, 0)">
      <rect width="225" height="58" rx="12" fill="url(#cardGrad)" stroke="rgba(129, 140, 248, 0.3)" stroke-width="1.2"/>
      <circle cx="32" cy="29" r="14" fill="rgba(129, 140, 248, 0.15)"/>
      <text x="32" y="34" fill="#818cf8" font-size="15" text-anchor="middle">🎯</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="700">chiaki-ng &amp; PS Remote</text>
      <text x="56" y="44" fill="#94a3b8" font-size="11">PS4 / PS5 Steam Deck Play</text>
    </g>

    <!-- Pill 3: KVM & WebRTC -->
    <g class="pill-3" transform="translate(510, 0)">
      <rect width="225" height="58" rx="12" fill="url(#cardGrad)" stroke="rgba(192, 132, 252, 0.3)" stroke-width="1.2"/>
      <circle cx="32" cy="29" r="14" fill="rgba(192, 132, 252, 0.15)"/>
      <text x="32" y="34" fill="#c084fc" font-size="15" text-anchor="middle">🖥️</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="700">Looking Glass &amp; Neko</text>
      <text x="56" y="44" fill="#94a3b8" font-size="11">VFIO KVM &amp; WebRTC Stacks</text>
    </g>

    <!-- Pill 4: Cloud SaaS & Rigs -->
    <g class="pill-4" transform="translate(765, 0)">
      <rect width="225" height="58" rx="12" fill="url(#cardGrad)" stroke="rgba(34, 197, 94, 0.3)" stroke-width="1.2"/>
      <circle cx="32" cy="29" r="14" fill="rgba(34, 197, 94, 0.15)"/>
      <text x="32" y="34" fill="#4ade80" font-size="15" text-anchor="middle">☁️</text>
      <text x="56" y="26" fill="#f8fafc" font-size="13" font-weight="700">Cloud Gaming Titans</text>
      <text x="56" y="44" fill="#94a3b8" font-size="11">GeForce Now • Shadow • Luna</text>
    </g>
  </g>

  <!-- Subtle bottom border accent -->
  <rect x="0" y="356" width="1200" height="4" fill="url(#neonGlow)"/>
</svg>
